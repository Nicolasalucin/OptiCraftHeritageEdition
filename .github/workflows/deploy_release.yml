name: Deploy Release

permissions:
  contents: write
  actions: read

on:
  release:
    types: [published]

jobs:
  # One matrix job per artifact produced by build.yml — same behaviour as
  # separate jobs, without eight copy-pasted blocks.
  deploy:
    name: Deploy ${{ matrix.platform }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: PlayStation 2
            artifact: opticraft-ps2
            file: OptiCraft-ps2.tar.gz
          - platform: Nintendo Wii
            artifact: opticraft-wii
            file: OptiCraft-wii.tar.gz
          - platform: Windows x64 GCC
            artifact: opticraft-windows-x64-gcc
            file: OptiCraft-windows-x64-gcc.tar.gz
          - platform: Windows x86 GCC
            artifact: opticraft-windows-x86-gcc
            file: OptiCraft-windows-x86-gcc.tar.gz
          - platform: Windows x86 Legacy GCC
            artifact: opticraft-windows-x86-gcc-legacy
            file: OptiCraft-windows-x86-gcc-legacy.tar.gz
          - platform: Windows x64 MSVC
            artifact: opticraft-windows-x64-msvc
            file: OptiCraft-windows-x64-msvc.tar.gz
          - platform: Linux x64 GCC
            artifact: opticraft-linux-x64-gcc
            file: OptiCraft-linux-x64-gcc.tar.gz
          - platform: Linux x86 GCC
            artifact: opticraft-linux-x86-gcc
            file: OptiCraft-linux-x86-gcc.tar.gz
    steps:
      - name: Download ${{ matrix.artifact }} artifact
        uses: dawidd6/action-download-artifact@v24
        with:
          github_token: ${{ github.token }}
          workflow: build.yml
          workflow_conclusion: success
          # Only runs of main: without this, "latest successful run" could be
          # an open PR's run and the release would ship unmerged binaries.
          branch: main
          name: ${{ matrix.artifact }}

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ matrix.file }}" \
            --repo "${{ github.repository }}" \
            --clobber
